name: Generate social preview exports

on:
  push:
    branches:
      - fix/mfp-012-social-preview-replacement
    paths:
      - scripts/generate_social_preview.py
      - .github/workflows/generate-social-preview.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/mfp-012-social-preview-replacement
          fetch-depth: 0

      - name: Generate deterministic RGB PNG exports
        run: python3 scripts/generate_social_preview.py

      - name: Validate generated PNG structure
        run: |
          python3 - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          expected = {
              Path('assets/repository-social-preview.png'): (1280, 640),
              Path('assets/repository-social-preview-thumbnail.png'): (320, 160),
          }
          for path, size in expected.items():
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path}: invalid PNG signature')
              length = struct.unpack('>I', data[8:12])[0]
              if data[12:16] != b'IHDR' or length != 13:
                  raise SystemExit(f'{path}: invalid IHDR')
              width, height, depth, color_type, compression, filtering, interlace = struct.unpack('>IIBBBBB', data[16:29])
              if (width, height) != size:
                  raise SystemExit(f'{path}: unexpected size {(width, height)}')
              if depth != 8 or color_type != 2:
                  raise SystemExit(f'{path}: expected 8-bit truecolor RGB, got depth={depth} type={color_type}')
              if compression or filtering or interlace:
                  raise SystemExit(f'{path}: unsupported PNG flags')
              cursor = 8
              compressed = bytearray()
              seen_iend = False
              while cursor < len(data):
                  chunk_length = struct.unpack('>I', data[cursor:cursor+4])[0]
                  chunk_type = data[cursor+4:cursor+8]
                  chunk_data = data[cursor+8:cursor+8+chunk_length]
                  stored_crc = struct.unpack('>I', data[cursor+8+chunk_length:cursor+12+chunk_length])[0]
                  actual_crc = zlib.crc32(chunk_type + chunk_data) & 0xffffffff
                  if stored_crc != actual_crc:
                      raise SystemExit(f'{path}: CRC mismatch in {chunk_type!r}')
                  if chunk_type == b'IDAT':
                      compressed.extend(chunk_data)
                  if chunk_type == b'IEND':
                      seen_iend = True
                  cursor += 12 + chunk_length
              raw = zlib.decompress(bytes(compressed))
              expected_raw = height * (1 + width * 3)
              if len(raw) != expected_raw or not seen_iend:
                  raise SystemExit(f'{path}: incomplete pixel payload')
              print(f'{path}: PASS {width}x{height} RGB bytes={len(data)}')
          PY

      - name: Commit generated assets
        run: |
          if git diff --quiet -- assets/repository-social-preview.png assets/repository-social-preview-thumbnail.png; then
            echo 'Generated assets already match the branch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/repository-social-preview.png assets/repository-social-preview-thumbnail.png
          git commit -m 'fix(social-preview): regenerate valid RGB exports'
          git push origin HEAD:fix/mfp-012-social-preview-replacement
